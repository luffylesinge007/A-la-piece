  <!-- Open hand cradling the coin -->
  <path d="M138 342
           C176 330 204 342 228 360
           C250 376 272 382 298 376
           C332 368 358 348 372 330
           A30 30 0 0 1 414 352
           C422 374 418 398 402 416
           C378 442 336 458 288 460
