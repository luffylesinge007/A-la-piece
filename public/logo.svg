<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="alp-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DE4258"/>
      <stop offset="1" stop-color="#C72147"/>
    </linearGradient>
  </defs>
  <!-- Brand tile -->
  <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#alp-tile)"/>
  <!-- Soft sheen -->
  <ellipse cx="256" cy="112" rx="222" ry="112" fill="#FFFFFF" opacity="0.05"/>

  <!-- Coin (outlined) -->
  <circle cx="262" cy="206" r="92" fill="none" stroke="#FFFFFF" stroke-width="14"/>
